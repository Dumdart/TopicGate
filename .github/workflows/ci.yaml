name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release versions
        run: python -m release.run_ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install package and dependencies
        run: python -m pip install -e ".[apps,test]"
      - name: Verify dashboard dependency contract
        run: python -m pytest tests/test_dashboard_dependencies.py -q
      - name: Verify Codex plugin bundle
        run: python -m pytest tests/test_plugin_bundle.py -q
      - name: Run tests
        run: python -m pytest -q
