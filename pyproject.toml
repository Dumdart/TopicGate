[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topicgate"
version = "0.2.0"
description = "Secure local access to your MQTT topics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt",
    "python-dotenv",
    "pytest",
    "pyside6",
    "qasync",
    "sqlalchemy",
]

[project.scripts]
topicgate = "topicgate.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
