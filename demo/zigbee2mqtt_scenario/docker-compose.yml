services:
  mosquitto:
    image: eclipse-mosquitto:2

    ports:
      - "${MQTT_PORT:-1883}:1883"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 1883 -u "$${MQTT_USERNAME}"
          -P "$${MQTT_PASSWORD}" -t '$$SYS/broker/version' -C 1 -W 3
      interval: 5s
      timeout: 4s
      retries: 10

    environment:
      MQTT_USERNAME: "${MQTT_USERNAME:-topicgate}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-topicgate-demo-password}"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    command:
      - /bin/sh
      - -c
      - |
        rm -f /mosquitto/data/passwords

        mosquitto_passwd \
          -b \
          -c \
          /mosquitto/data/passwords \
          "$${MQTT_USERNAME}" \
          "$${MQTT_PASSWORD}"

        chmod 644 /mosquitto/data/passwords

        echo "Mosquitto broker profile:"
        echo "  Name: Zigbee2MQTT Demo"
        echo "  Host: localhost"
        echo "  Port: ${MQTT_PORT:-1883}"
        echo "  Username: $${MQTT_USERNAME}"
        echo "  Password: $${MQTT_PASSWORD}"
        echo "  TLS: false"

        exec mosquitto -c /mosquitto/config/mosquitto.conf
